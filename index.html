<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Links</title>
</head>
<body>
  No content for now.
  <script>
    const links = {
      'boxA1': 'https://telex.hu'
    };
    console.log('parsing...');
    if (window.location.search === '') {
      console.log('No search params.');
    } else {
      const target = links[window.location.search.substring(1)];
      console.log('Redirection:', window.location.search.substring(1), '->', target);
      window.location.href = target;
    }
  </script>
</body>
</html>
